name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    # Swift 6 language mode + a current SDK; the package needs tools 6.0 or newer.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Hardware-dependent sampler tests skip themselves when CI is set.
      - name: Test
        run: swift test

      - name: Build .app bundle
        run: support/make-app.sh "${{ steps.version.outputs.version }}"

      - name: Create zip
        run: ditto -c -k --keepParent wtop.app wtop.app.zip

      - name: Compute sha256
        id: sha
        run: echo "sha256=$(shasum -a 256 wtop.app.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" wtop.app.zip \
            --title "v${VERSION}" \
            --generate-notes

      # This repo is its own Homebrew tap: the cask lives in Casks/wtop.rb on master and
      # points at the release asset just uploaded. Only the version and sha256 lines are
      # rewritten, so the `v#{version}` interpolation in the url stanza stays intact.
      - name: Bump cask
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"

          git fetch origin master
          git checkout -B master origin/master
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
            Casks/wtop.rb
          if git diff --quiet; then
            echo "Cask already at ${VERSION}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "cask: wtop ${VERSION}"
          git push origin master
