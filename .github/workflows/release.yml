name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    # Swift 6 language mode + a current SDK; the package needs tools 6.0 or newer.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Hardware-dependent sampler tests skip themselves when CI is set.
      - name: Test
        run: swift test

      - name: Build .app bundle
        run: support/make-app.sh "${{ steps.version.outputs.version }}"

      - name: Create zip
        run: ditto -c -k --keepParent wtop.app wtop.app.zip

      - name: Compute sha256
        id: sha
        run: echo "sha256=$(shasum -a 256 wtop.app.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" wtop.app.zip \
            --title "v${VERSION}" \
            --generate-notes

      # brew bump-cask-pr is Homebrew's canonical cask bumper — preserves
      # #{version} interpolation in the url stanza (unlike mislav's JS action,
      # which parses the cask as plain text). --write-only --commit makes it
      # commit locally without opening a PR; we push the commit ourselves.
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Bump homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"

          brew tap abizer/homebrew-tap
          tap_repo="$(brew --repository abizer/homebrew-tap)"
          cd "$tap_repo"
          git remote set-url origin "https://x-access-token:${TAP_TOKEN}@github.com/abizer/homebrew-tap.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          brew bump-cask-pr \
            --write-only --commit \
            --no-audit --no-style \
            --version="${VERSION}" \
            --sha256="${SHA}" \
            abizer/tap/wtop

          git push origin HEAD:master
